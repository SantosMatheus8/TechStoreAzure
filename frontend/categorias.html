<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Cloud - Categorias</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>TechStore Cloud</h1>
        <nav>
            <a href="index.html">Produtos</a>
            <a href="categorias.html" class="active">Categorias</a>
        </nav>
    </header>

    <div class="container">
        <div id="alert-container"></div>

        <div class="card">
            <h2 id="form-title">Nova Categoria</h2>
            <br>
            <form id="category-form">
                <div class="form-group">
                    <label for="cat-nome">Nome *</label>
                    <input type="text" id="cat-nome" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="cat-descricao">Descrição</label>
                    <textarea id="cat-descricao" maxlength="500"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Salvar</button>
                    <button type="button" class="btn btn-outline" id="cancel-btn" style="display:none" onclick="cancelEdit()">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Carregando categorias...</p>
            </div>

            <div id="categories-table" style="display:none">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="categories-body"></tbody>
                    </table>
                </div>

                <div class="pagination" id="pagination"></div>
            </div>

            <div id="empty-state" class="empty-state" style="display:none">
                <p>Nenhuma categoria encontrada.</p>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <h3>Confirmar exclusão</h3>
            <p>Tem certeza que deseja excluir a categoria <strong id="delete-cat-name"></strong>?</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancelar</button>
                <button class="btn btn-danger" id="confirm-delete-btn">Excluir</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="categorias.js"></script>
</body>
</html>
