<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Cloud - Produtos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>TechStore Cloud</h1>
        <nav>
            <a href="index.html" class="active">Produtos</a>
            <a href="categorias.html">Categorias</a>
        </nav>
    </header>

    <div class="container">
        <div id="alert-container"></div>

        <div class="toolbar">
            <input type="text" id="search-input" placeholder="Buscar por nome...">
            <select id="category-filter">
                <option value="">Todas as categorias</option>
            </select>
            <a href="produto-form.html" class="btn btn-primary">+ Novo Produto</a>
        </div>

        <div class="card">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Carregando produtos...</p>
            </div>

            <div id="products-table" style="display:none">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Estoque</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="products-body"></tbody>
                    </table>
                </div>

                <div class="pagination" id="pagination"></div>
            </div>

            <div id="empty-state" class="empty-state" style="display:none">
                <p>Nenhum produto encontrado.</p>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <h3>Confirmar exclusão</h3>
            <p>Tem certeza que deseja excluir o produto <strong id="delete-product-name"></strong>?</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeDeleteModal()">Cancelar</button>
                <button class="btn btn-danger" id="confirm-delete-btn">Excluir</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
